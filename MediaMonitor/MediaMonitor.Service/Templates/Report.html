<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<style>
body { font-family: Arial; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
th { background: #eee; }
.stats { padding: 15px; background: #eef5fb; border-radius: 6px; margin-bottom: 20px; }
.stats h3 { margin: 0; color: #2980b9; }
.stats ul { margin: 0; padding-left: 20px; color: #555; }
</style>
</head>
<body>

<div class="stats">
    <h3>Résumé du rapport</h3>
    <p style="margin:8px 0">
        <b>Total médias :</b> {{TotalMedias}}<br>
        <b>Nombre de pages :</b> {{TotalPages}}<br>
        <b>Médias par page :</b> {{MediasPerPage}}
    </p>
    <ul style="margin:0;padding-left:20px;color:#555">
        {{TypeStats}}
    </ul>
</div>

<h2>Historique MediaMonitor</h2>
<table>
    <thead>
        <tr>
            <th>Heure</th>
            <th>Client</th>
            <th>Type</th>
            <th>Nom</th>
            <th>Saison</th>
            <th>Episode</th>
            <th>Fichier</th>
            <th>Chemin</th>
        </tr>
    </thead>
    <tbody>
        {{Rows}}
    </tbody>
</table>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MCEMonitor – Tableau de bord média</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <header class="header">
        <h1>MCEMonitor</h1>
        <nav>
            <a href="#home">Accueil</a>
            <a href="#downloads">Téléchargements</a>
            <a href="#docs">Documentation</a>
            <a href="#screenshots">Captures</a>
        </nav>
    </header>

    <!-- HERO FULL WIDTH -->
    <div id="hero-container"></div>

    <!-- CONTENT LIMITÉ À 1000px -->
    <div id="content"></div>

    <!-- VIEWER PREMIUM -->
    <div class="viewer" id="viewer">
        <img id="viewer-img" src="" alt="">
        <button id="viewer-prev" class="viewer-nav">⟨</button>
        <button id="viewer-next" class="viewer-nav">⟩</button>
    </div>

    <footer>
        <p>© 2026 MCEMonitor – Projet open-source</p>
    </footer>

    <script>
        async function loadPage(page) {
            const file = {
                home: "pages/home.html",
                downloads: "pages/downloads.html",
                docs: "pages/docs.html",
                screenshots: "pages/screenshots.html"
            }[page] || "pages/home.html";

            const response = await fetch(file);
            const html = await response.text();

            const temp = document.createElement("div");
            temp.innerHTML = html;

            const hero = temp.querySelector(".hero");
            const features = temp.querySelector(".features");

            // HERO FULL WIDTH
            document.getElementById("hero-container").innerHTML =
                hero ? hero.outerHTML : "";

            // CONTENT LIMITÉ À 1000px
            document.getElementById("content").innerHTML =
                features ? features.outerHTML : html;

            // Met à jour la liste des images pour le viewer
            updateGalleryImages();
        }

        window.addEventListener("hashchange", () => {
            loadPage(location.hash.substring(1));
        });

        loadPage(location.hash.substring(1) || "home");

        // ===========================
        // VIEWER PREMIUM
        // ===========================

        let galleryImages = [];
        let currentIndex = 0;

        function updateGalleryImages() {
            galleryImages = Array.from(document.querySelectorAll(".card img"));
        }

        // Ouvrir le viewer
        document.addEventListener("click", function(e) {
            if (e.target.tagName === "IMG" && e.target.closest(".card")) {
                currentIndex = galleryImages.indexOf(e.target);

                const viewer = document.getElementById("viewer");
                const viewerImg = document.getElementById("viewer-img");

                viewerImg.src = e.target.src;
                viewer.style.display = "flex";

                viewerImg.classList.add("zoom-in");
                setTimeout(() => viewerImg.classList.remove("zoom-in"), 300);
            }
        });

        // Fermer le viewer
        document.getElementById("viewer").addEventListener("click", function(e) {
            if (e.target.id === "viewer") {
                this.style.display = "none";
            }
        });

        // Navigation ← →
        document.getElementById("viewer-prev").addEventListener("click", function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
            document.getElementById("viewer-img").src = galleryImages[currentIndex].src;
        });

        document.getElementById("viewer-next").addEventListener("click", function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % galleryImages.length;
            document.getElementById("viewer-img").src = galleryImages[currentIndex].src;
        });

        // Navigation clavier
        document.addEventListener("keydown", function(e) {
            const viewer = document.getElementById("viewer");
            if (viewer.style.display !== "flex") return;

            if (e.key === "ArrowLeft") {
                currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
                document.getElementById("viewer-img").src = galleryImages[currentIndex].src;
            }
            if (e.key === "ArrowRight") {
                currentIndex = (currentIndex + 1) % galleryImages.length;
                document.getElementById("viewer-img").src = galleryImages[currentIndex].src;
            }
            if (e.key === "Escape") {
                viewer.style.display = "none";
            }
        });
    </script>
</body>
</html>
